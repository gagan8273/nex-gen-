<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body topmargin="100" align="center"><form id="studentForm"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRb4RcrxvCkpTQYLjA12aAgSDmGYUUPRhrtQVJcchqTBg&s)
    "><br><div align="center">
 <h1>STUDENT REGISTRATION FORM</h1><br><br>
 <label for="name">Name</label>
<input type="text"  name="name"
placeholder="Ramandeep Singh" required>
<br><br>
<label for="number">Age</label>
<input type="number"><br><br>
select your state
<select>
    <optgroup label="state"></optgroup>
    <option>Andhra pradesh</option>
      <option>Arunachal pradesh</option>
        <option>Assam</option>
          <option>Bihar</option>
            <option>Chhattisgarh</option>
            <option>Delhi</option>
              <option>Goa</option>
                <option>Gujarat</option>
                  <option>Haryana</option>
                    <option>Himachal pradesh</option>
                      <option>Jharkhand</option>
                        <option>Karnataka</option>
                          <option>Kerala</option>
                            <option>Madhya pradesh</option>
                              <option>Maharashtra</option>
                                <option>Manipur</option>
                                  <option>Tripura</option>
                                    <option>Uttar pradesh</option>
                                      <option>Uttarakhand</option>
                                        <option>West bengal</option>
                                        </select>
           <br><br>
           <label>Your university name</label>
           <input type="text" name="university"><br><br>
           <label>Your college name</label>
           <input type="text" name="college"><br><br>
         <label> Select your gender</label><br><br>
         Male<input type="radio" name="gender" value="male">
           Female<input type="radio" name="gender" value="female">
           Prefer not to say<input type="radio" name="gender" value="none"><br><br>
      <label>Your Roll number</label>                                  
<input type="text"  name="roll"
placeholder="2500xxxx" required>
<br><br><br>
 <label>Your email id</label>                                  
<input type="email"  name="email"
placeholder="xyz@gmail.com" required>
<br><br>
<label>Add your mobile number</label>
<input type="tel" name="mobile">
<br>
<br>
<label>Add your photo </label><br>
<input type="file" id="photo"
name="photo" accept="image/*"><button>upload</button>
<br><br>
I have read all terms and conditions<input type="checkbox">
<br><br>
<a href="index.html"><button>submit</button></a></div></form>
<script>
const form = document.getElementById("studentForm");
const photo = document.getElementById("photo");

/* Check that JavaScript is working */
alert("JavaScript is working!");

/* Photo upload */
photo.addEventListener("change", function () {
    if (photo.files.length > 0) {
        alert("Photo selected: " + photo.files[0].name);
    }
});

/* Form submission */
form.addEventListener("submit", function (event) {

    event.preventDefault();

    const name = form.querySelector('input[name="name"]').value.trim();
    const age = form.querySelector('input[type="number"]').value;
    const state = form.querySelector("select").value;

    const university =
        form.querySelector('input[name="university"]').value.trim();

    const college =
        form.querySelector('input[name="college"]').value.trim();

    const gender =
        form.querySelector('input[name="gender"]:checked');

    const rollNumber =
        form.querySelector('input[name="roll"]').value.trim();

    const email =
        form.querySelector('input[name="email"]').value.trim();

    const mobile =
        form.querySelector('input[name="mobile"]').value.trim();

    const terms =
        form.querySelector('input[type="checkbox"]').checked;

    /* Name validation */
    if (name === "") {
        alert("Please enter your name.");
        return;
    }

    /* Age validation */
    if (age === "" || age < 1 || age > 100) {
        alert("Please enter a valid age.");
        return;
    }

    /* State validation */
    if (state === "") {
        alert("Please select your state.");
        return;
    }

    /* Gender validation */
    if (!gender) {
        alert("Please select your gender.");
        return;
    }

    /* Mobile validation */
    const mobilePattern = /^[6-9]\d{9}$/;

    if (!mobilePattern.test(mobile)) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
    }

    /* Email validation */
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {
        alert("Please enter a valid email.");
        return;
    }

    /* Photo validation */
    if (photo.files.length === 0) {
        alert("Please upload your photo.");
        return;
    }

    /* Terms validation */
    if (!terms) {
        alert("Please accept the terms and conditions.");
        return;
    }

    /* Save data */
    const studentData = {
        name: name,
        age: age,
        state: state,
        university: university,
        college: college,
        gender: gender.value,
        rollNumber: rollNumber,
        email: email,
        mobile: mobile,
        photoName: photo.files[0].name
    };

    localStorage.setItem(
        "studentRegistration",
        JSON.stringify(studentData)
    );

    alert("🎉 Registration submitted successfully!");

    form.reset();
});
</script>
</body>
</html>
