<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="add3.css">
</head>
<body>

  <main class="page-wrapper">
    <section class="form-card">

      <div class="form-header">
        <div class="header-icon">🌀</div>
        <div>
          <p class="eyebrow">Welcome to our portal</p>
          <h1>Student Registration</h1>
          <p class="subtitle">Complete the form below to create your student profile.</p>
        </div>
      </div>

      <form action="#" method="post" enctype="multipart/form-data">

        <div class="section-title">
          <span>01</span>
          <h2>Personal information</h2>
        </div>

        <div class="form-grid">
          <div class="input-group">
            <label for="name">Full name <span>*</span></label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your full name"
              autocomplete="name"
              required
            >
          </div>

          <div class="input-group">
            <label for="age">Age <span>*</span></label>
            <input
              type="number"
              id="age"
              name="age"
              placeholder="Enter your age"
              min="1"
              max="100"
              required
            >
          </div>

          <div class="input-group">
            <label for="state">State <span>*</span></label>
            <select id="state" name="state" required>
              <option value="" selected disabled>Select your state</option>
              <option>Andhra Pradesh</option>
              <option>Arunachal Pradesh</option>
              <option>Assam</option>
              <option>Bihar</option>
              <option>Chhattisgarh</option>
              <option>Delhi</option>
              <option>Goa</option>
              <option>Gujarat</option>
              <option>Haryana</option>
              <option>Himachal Pradesh</option>
              <option>Jharkhand</option>
              <option>Karnataka</option>
              <option>Kerala</option>
              <option>Madhya Pradesh</option>
              <option>Maharashtra</option>
              <option>Manipur</option>
              <option>Tripura</option>
              <option>Uttar Pradesh</option>
              <option>Uttarakhand</option>
              <option>West Bengal</option>
            </select>
          </div>
        </div>

        <div class="section-title">
          <span>02</span>
          <h2>Academic details</h2>
        </div>

        <div class="form-grid">
          <div class="input-group">
            <label for="university">University name <span>*</span></label>
            <input
              type="text"
              id="university"
              name="university"
              placeholder="Enter your university name"
              required
            >
          </div>

          <div class="input-group">
            <label for="college">College name <span>*</span></label>
            <input
              type="text"
              id="college"
              name="college"
              placeholder="Enter your college name"
              required
            >
          </div>

          <div class="input-group">
            <label for="roll-number">Roll number <span>*</span></label>
            <input
              type="text"
              id="roll-number"
              name="roll_number"
              placeholder="Enter your roll number"
              required
            >
          </div>

          <div class="input-group">
            <label for="email">Email address <span>*</span></label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
          </div>

          <div class="input-group">
            <label for="mobile">Mobile number <span>*</span></label>
            <input
              type="tel"
              id="mobile"
              name="mobile"
              placeholder="+91 98765 43210"
              autocomplete="tel"
              pattern="[0-9+\-\s]{10,}"
              required
            >
          </div>

          <div class="input-group">
            <label>Gender <span>*</span></label>

            <div class="radio-options">
              <label class="radio-card">
                <input type="radio" name="gender" value="Male" required>
                <span>Male</span>
              </label>

              <label class="radio-card">
                <input type="radio" name="gender" value="Female">
                <span>Female</span>
              </label>

              <label class="radio-card">
                <input type="radio" name="gender" value="Prefer not to say">
                <span>Prefer not to say</span>
              </label>
            </div>
          </div>
        </div>

        <div class="section-title">
          <span>03</span>
          <h2>Profile photo</h2>
        </div>

        <div class="upload-box">
          <div class="upload-icon">↑</div>
          <div>
            <label for="photo" class="upload-label">Upload your photo</label>
            <p>PNG, JPG or JPEG. Maximum file size: 2MB</p>
          </div>
          <input
            type="file"
            id="photo"
            name="photo"
            accept=".png,.jpg,.jpeg"
          >
        </div>

        <label class="terms">
          <input type="checkbox" name="terms" required>
          <span>
            I have read and agree to the
            <a href="#">terms and conditions</a>.
          </span>
        </label>

        <div class="form-footer">
          <p><span>*</span> Required fields</p>
          <button type="submit">
            Submit registration
            <span>→</span>
          </button>
        </div>

      </form>
    </section>
  </main>
<script>
    const form = document.getElementById("registrationForm");
const photoInput = document.getElementById("photo");
const photoPreview = document.getElementById("photoPreview");
const formMessage = document.getElementById("formMessage");

const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const mobileInput = document.getElementById("mobile");
const ageInput = document.getElementById("age");

const MAX_FILE_SIZE = 2 * 1024 * 1024;
const allowedFileTypes = ["image/jpeg", "image/png", "image/jpg"];

function showMessage(message, type) {
  formMessage.textContent = message;
  formMessage.className = `form-message ${type}`;

  setTimeout(() => {
    formMessage.textContent = "";
    formMessage.className = "form-message";
  }, 5000);
}

function setInvalid(input, message) {
  input.classList.add("invalid");
  input.setCustomValidity(message);
}

function setValid(input) {
  input.classList.remove("invalid");
  input.setCustomValidity("");
}

function validateName() {
  const name = nameInput.value.trim();

  if (name.length < 3) {
    setInvalid(nameInput, "Please enter at least 3 characters.");
    return false;
  }

  if (!/^[a-zA-Z\s]+$/.test(name)) {
    setInvalid(nameInput, "Name can contain letters and spaces only.");
    return false;
  }

  setValid(nameInput);
  return true;
}

function validateAge() {
  const age = Number(ageInput.value);

  if (!age || age < 1 || age > 100) {
    setInvalid(ageInput, "Please enter an age between 1 and 100.");
    return false;
  }

  setValid(ageInput);
  return true;
}

function validateEmail() {
  const email = emailInput.value.trim();
  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if (!emailPattern.test(email)) {
    setInvalid(emailInput, "Please enter a valid email address.");
    return false;
  }

  setValid(emailInput);
  return true;
}

function validateMobile() {
  const mobile = mobileInput.value.trim();
  const mobilePattern = /^[0-9+\-\s]{10,15}$/;

  if (!mobilePattern.test(mobile)) {
    setInvalid(mobileInput, "Please enter a valid mobile number.");
    return false;
  }

  setValid(mobileInput);
  return true;
}

function validatePhoto() {
  const file = photoInput.files[0];

  if (!file) {
    photoPreview.style.display = "none";
    return true;
  }

  if (!allowedFileTypes.includes(file.type)) {
    showMessage("Only JPG, JPEG and PNG files are allowed.", "error");
    photoInput.value = "";
    photoPreview.style.display = "none";
    return false;
  }

  if (file.size > MAX_FILE_SIZE) {
    showMessage("Photo size must be less than 2MB.", "error");
    photoInput.value = "";
    photoPreview.style.display = "none";
    return false;
  }

  const reader = new FileReader();

  reader.addEventListener("load", () => {
    photoPreview.src = reader.result;
    photoPreview.style.display = "block";
  });

  reader.readAsDataURL(file);
  return true;
}

nameInput.addEventListener("input", validateName);
ageInput.addEventListener("input", validateAge);
emailInput.addEventListener("input", validateEmail);
mobileInput.addEventListener("input", validateMobile);
photoInput.addEventListener("change", validatePhoto);

form.addEventListener("submit", function (event) {
  event.preventDefault();

  const isNameValid = validateName();
  const isAgeValid = validateAge();
  const isEmailValid = validateEmail();
  const isMobileValid = validateMobile();
  const isPhotoValid = validatePhoto();

  if (!isNameValid || !isAgeValid || !isEmailValid || !isMobileValid || !isPhotoValid) {
    showMessage("Please correct the highlighted fields.", "error");
    return;
  }

  if (!form.checkValidity()) {
    form.reportValidity();
    showMessage("Please complete all required fields.", "error");
    return;
  }

  const formData = new FormData(form);
  const studentName = formData.get("name");

  showMessage(
    `Registration submitted successfully for ${studentName}!`,
    "success"
  );

  form.reset();
  photoPreview.src = "";
  photoPreview.style.display = "none";
});
</script>
</body>
</html>
